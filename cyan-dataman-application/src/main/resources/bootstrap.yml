# 基础应用配置
spring:
  profiles:
    active: dev
  application:
    name:  cyan-dataman
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
# 服务监控端点（暴露所有端点，生产环境需调整）
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# StarRocks 数据库连接配置
starrocks:
  url: jdbc:mysql://10.0.0.2:32132/?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  username: root
  password: 123456

# Dify AI 关联推荐配置，默认关闭，实际地址和 key 通过环境配置或 Nacos 覆盖
dify:
  relation:
    enabled: true
    base-url: "http://10.0.0.2:20080/v1"
    api-key: "app-TFQUkCTgneLaJuSOmaiqC2Vr"

# 元数据表关联推荐 Embedding 配置，base-url 支持 OpenAI-compatible 根地址或完整 /embeddings 地址
embedding:
  relation:
    enabled: ${EMBEDDING_RELATION_ENABLED:false}
    base-url: ${EMBEDDING_RELATION_BASE_URL:https://open.bigmodel.cn/api/paas/v4/embeddings}
    api-key: ${EMBEDDING_RELATION_API_KEY:}
    model: ${EMBEDDING_RELATION_MODEL:embedding-3}
    dimension: ${EMBEDDING_RELATION_DIMENSION:512}

# 元数据表关联推荐 Qdrant 配置
qdrant:
  relation:
    enabled: ${QDRANT_RELATION_ENABLED:false}
    base-url: ${QDRANT_RELATION_BASE_URL:http://10.0.0.2:6333}
    api-key: ${QDRANT_RELATION_API_KEY:}
    collection: ${QDRANT_RELATION_COLLECTION:metadata_table_relation}
    top-k: ${QDRANT_RELATION_TOP_K:30}
    score-threshold: ${QDRANT_RELATION_SCORE_THRESHOLD:0.3}
